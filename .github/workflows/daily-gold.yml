name: Generate daily gold-rate Status image

on:
  push:
    branches: [main]
    paths:
      - 'generate.py'
      - 'requirements.txt'
      - 'assets/logo.png'
      - '.github/workflows/daily-gold.yml'
  workflow_dispatch:
  schedule:
    # GitHub's cron is UTC: 03:05 UTC = 08:35 in Sri Lanka (UTC+05:30).
    - cron: '5 3 * * *'

permissions:
  contents: write

concurrency:
  group: daily-gold-rate-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Generate real image (fail if rates are stale or invalid)
        env:
          SHOP_NAME: ELEGANCE
          SHOP_SUBTITLE: GEM & JEWELLERS
          SHOP_TAGLINE: Timeless Beauty, enduring Gold
          SHOP_ADDRESS: No. 97, Main Street, Tangalle
          SHOP_PHONE: 077 077 7998
        run: python generate.py
      - name: Publish latest image to this repository
        run: |
          git config user.name 'gold-rate-automation[bot]'
          git config user.email 'gold-rate-automation@users.noreply.github.com'
          git add docs/today.png docs/today.json
          if ! git diff --cached --quiet; then
            git commit -m "Update gold-rate image $(date -u +%F)"
            # A README or other unrelated commit may arrive during generation.
            # Rebase safely; if the image itself conflicts, fail rather than force-push.
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
